<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <title>گالری | تعزیه ناب</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #1c1c1c;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }

        .logo img {
            max-height: 60px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #d4af37;
        }

        .gallery-section {
            padding: 60px 8%;
            text-align: center;
        }

        .gallery-section h1 {
            font-size: 42px;
            color: #d4af37;
            margin-bottom: 15px;
        }

        .gallery-section p {
            color: #ccc;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 25px;
        }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 14px;
            border: 2px solid #333;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
            border-color: #d4af37;
        }

        .back-button {
            display: inline-block;
            margin-top: 40px;
            background: #d4af37;
            color: #111;
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            background: #080808;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            color: #aaa;
        }

    </style>

</head>

<body>

    <header>

        <div class="logo">
            <img src="logo.png" alt="تعزیه ناب">
        </div>

        <nav>
            <a href="index.html">خانه</a>
            <a href="#">ویدیوها</a>
            <a href="#">نسخه‌ها</a>
            <a href="gallery.html">گالری</a>
            <a href="#">درباره ما</a>
        </nav>

    </header>


    <section class="gallery-section">

        <h1>📸 گالری تعزیه ناب</h1>

        <p>
            تصاویر اجراها و مجالس تعزیه
        </p>

        <div class="gallery">

            <img src="gallery1.jpg" alt="تعزیه ناب ۱">

            <img src="gallery2.jpg" alt="تعزیه ناب ۲">

            <img src="gallery3.jpg" alt="تعزیه ناب ۳">

            <img src="gallery4.jpg" alt="تعزیه ناب ۴">

            <img src="gallery5.jpg" alt="تعزیه ناب ۵">

            <img src="gallery6.jpg" alt="تعزیه ناب ۶">

            <img src="gallery7.jpg" alt="تعزیه ناب ۷">

        </div>

        <a href="index.html" class="back-button">
            ← بازگشت به صفحه اصلی
        </a>

    </section>


    <footer>

        © ۱۴۰۵ تعزیه ناب

    </footer>

</body>

</html>
